<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 449 231" fill="currentColor">
  <!--
    Aus dem PNG vermessen und als Geometrie neu aufgebaut, nicht
    nachgezeichnet. Die tragenden Masse:
      Neigung      24 Grad gegen die Senkrechte (gemessen 23,88 +/- 0,67)
      Strichstaerke 38 waagerecht, das sind 34,71 senkrecht zum Strich
      Schale des R  Kreisring um (296 / 69,5), aussen 69,5, innen 34,79
                    Der Querbalken liegt tangential am Aussenkreis, die
                    beiden Waagerechten der Punze am Innenkreis.
      Winkel        Arme unter 41,35 Grad, um 180 Grad gedreht statt
                    gespiegelt: links ist der obere Arm der lange.
    Gegen das Original gerastert deckt sich die Form zu 94,5 Prozent,
    der mittlere Kantenversatz liegt unter einem Pixel bei 512 Punkten
    Breite. Die Abweichung ist das Rauschen der alten Rasterung.
  -->
