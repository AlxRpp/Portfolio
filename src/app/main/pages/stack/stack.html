<section class="stack" id="stack">

  <div class="stack__inner">

    <header class="stack__head">
      <p class="stack__eyebrow" data-reveal>
        <span class="stack__marker" aria-hidden="true"></span>
        {{ 'stack.eyebrow' | translate }}
      </p>
      <h2 class="stack__heading" data-reveal>{{ 'stack.heading' | translate }}</h2>
      <p class="stack__lead" data-reveal>{{ 'stack.lead' | translate }}</p>
    </header>

    <!--
      Vier Spalten nach Zusammenhang. Anders als das fruehere Laufband ist
      das hier echter Text, deshalb braucht es keine eigene Ausgabe fuer
      Screenreader mehr.
    -->
    <ul class="stack__groups">
      @for (gruppe of gruppen; track gruppe.id) {
        <li class="stack__group">
          <!--
            Zwei Ebenen mit Absicht: Der Schein sitzt aussen, die
            beschnittene Flaeche innen. clip-path wird nach dem Filter
            angewendet, ein drop-shadow auf derselben Karte waere also
            mit weggeschnitten.
          -->
          <div class="stack__card">
            <h3 class="stack__group-title">
              {{ 'stack.groups.' + gruppe.id | translate }}
            </h3>

            <ul class="stack__list">
              @for (item of gruppe.items; track item.name) {
                <li class="stack__item">
                  <!--
                    Die Zelle steht auch ohne Zeichen. Sonst rutschte der
                    Name in die Zeichenspalte und die Liste verlore ihre
                    Flucht.
                  -->
                  <span
                    class="stack__icon"
                    aria-hidden="true"
                    [class.is-leer]="!item.icon"
                    [style.--icon]="
                      item.icon ? 'url(/assets/icons/tech/' + item.icon + '.svg)' : null
                    "
                  ></span>
                  {{ item.name }}
                </li>
              }
            </ul>
          </div>
        </li>
      }
    </ul>

  </div>

</section>
