<section class="hero">

  <!--
    Unter 900px gar nicht erst erzeugt: kein SVG, kein Beobachter, keine
    Zeitleiste. Das Netz kostet dort also nichts.
  -->
  @if (signale.netzAn()) {
    <app-signal-layer bereich="hero" />
  }

  <!--
    Rein dekorativ, der Name steht direkt daneben als h1. Deshalb
    aria-hidden statt eines Alternativtextes.

    Inline und nicht als img, weil das Logo ueber currentColor dieselbe
    Farbe traegt wie die Bahnen des Signalnetzes. Es wird NICHT
    gezeichnet: DrawSVG zeichnet bei gefuellten Pfaden die Silhouette,
    daran ist die alte Fassung auf origin/redesign-hero gescheitert.

    Die Geometrie ist aus dem PNG vermessen und neu aufgebaut, nicht
    nachgezeichnet: Neigung 24 Grad, Strichstaerke 38 waagerecht, die
    Schale des R ein echter Kreisring. Dieselbe Form liegt als Datei
    unter assets/icons/brand/logo.svg.
  -->
  <!--
    Kein data-reveal: Die Marke bringt ihren eigenen Auftritt mit, das
    Zeichnen in hero.ts. Beides zusammen schriebe auf denselben Kasten,
    die Einblendung ein y, die Mausneigung x, y und zwei Drehungen. Sie
    wuerden sich gegenseitig ueberschreiben.
  -->
  <div class="hero__mark" aria-hidden="true">
    <svg class="hero__mark-svg" focusable="false" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 449 231" fill="currentColor">
      <path d="M 73,62.75 L 0,127 L 55.5,175.84 L 55.5,138 L 43,127 L 73,100.6 Z"/>
      <path d="M 150,0 L 188,0 L 290.85,231 L 252.85,231 L 210.27,135.38 L 167.7,231 L 129.7,231 L 191.13,93.03 L 168.86,43 L 85.15,231 L 47.15,231 Z"/>
      <path d="M 221,0 L 296,0 A 69.5,69.5 0 0 1 322.67,133.68 L 366,231 L 328,231 L 271.58,104.29 L 296,104.29 A 34.79,34.79 0 0 0 330.79,69.5 A 34.79,34.79 0 0 0 296,34.71 L 236.46,34.71 Z"/>
      <path d="M 393.5,77.16 L 449,126 L 376,190.25 L 376,152.4 L 406,126 L 393.5,115 Z"/>
    </svg>
  </div>

  <div class="hero__inner">

    <p class="hero__eyebrow" data-reveal>
      <span class="hero__dot" aria-hidden="true"></span>
      {{ 'hero.role' | translate }}
      <span class="hero__sep" aria-hidden="true">&middot;</span>
      {{ 'hero.location' | translate }}
    </p>

    <h1 class="hero__name">{{ 'hero.name' | translate }}</h1>

    <p class="hero__claim" data-reveal>{{ 'hero.claim' | translate }}</p>

    <p class="hero__lead" data-reveal>{{ 'hero.lead' | translate }}</p>

    <div class="hero__actions" data-reveal>
      <a class="btn btn--primary" routerLink="/" fragment="projects">
        {{ 'hero.ctaProjects' | translate }}
        <span aria-hidden="true">&rarr;</span>
      </a>
      <a class="btn btn--ghost" routerLink="/" fragment="contact">
        {{ 'hero.ctaContact' | translate }}
      </a>
    </div>

  </div>
</section>
