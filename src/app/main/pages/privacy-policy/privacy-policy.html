<section class="legal">
  <div class="legal__inner">
    <a class="legal__back" routerLink="/" fragment="contact">
      <span aria-hidden="true">&larr;</span>
      {{ 'legal.back' | translate }}
    </a>

    <h1 class="legal__heading">{{ 'privacy.heading' | translate }}</h1>

    @if (geladen()) {
      <!--
        Der Text kommt aus einer eigenen Datei, siehe privacy-policy.ts.
        Angular bereinigt ihn beim Einsetzen; das ist hier nicht noetig,
        weil die Datei aus dem eigenen Build stammt, aber es kostet
        nichts und die Ausnahme muesste sonst begruendet werden.
      -->
      <div class="legal__inhalt" [innerHTML]="inhalt()"></div>
      <p class="legal__stand">{{ 'legal.stand' | translate }}: {{ stand() }}</p>
    } @else {
      <p class="legal__placeholder">{{ 'legal.missing' | translate }}</p>
    }
  </div>
</section>
