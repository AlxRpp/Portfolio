<footer class="footer">
  <div class="footer__inner">

    <a class="footer__logo" routerLink="/" [attr.aria-label]="'header.home' | translate">
      <img src="/assets/icons/brand/logo.png" alt="" width="30" height="30" decoding="async" />
    </a>

    <p class="footer__meta">&copy; {{ jahr }} Alexander Ruppel</p>

    <nav class="footer__links" [attr.aria-label]="'footer.legalNav' | translate">
      <a routerLink="/legal-notice">{{ 'footer.imprint' | translate }}</a>
      <a routerLink="/privacy-policy">{{ 'footer.privacy' | translate }}</a>
    </nav>

  </div>
</footer>
