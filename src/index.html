<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Alexander Ruppel | Softwareentwickler</title>
  <meta name="description"
        content="Alexander Ruppel, Softwareentwickler in Delbrück. KI-Anwendungen von der Anforderung bis in den produktiven Einsatz. Python, Django, REST-APIs, Angular.">
  <meta name="author" content="Alexander Ruppel">

  <base href="/">
  <meta name="theme-color" content="#00BDC6">
  <meta name="color-scheme" content="dark">

  <!--
    Der Ordner heisst favicons und NICHT icons.
    
    Apache bringt in seiner Grundkonfiguration einen serverweiten Alias
    /icons/ mit, der auf seinen eigenen Symbolordner fuer
    Verzeichnislisten zeigt. Ein Ordner dieses Namens im eigenen
    Webverzeichnis wird dadurch nie erreicht: Der Server liefert unter
    /icons/ seine Symbole aus und fuer alles andere dort einen 404.
    Sichtbar wird das erst auf dem Server, lokal laeuft es.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/favicon-180.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Schriften liegen lokal; ohne preload blitzt beim ersten Aufbau
       die Ersatzschrift auf und SplitText vermisst falsch. -->
  <link rel="preload" href="/assets/fonts/BricolageGrotesque-Variable.woff2"
        as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/JetBrainsMono-Variable.woff2"
        as="font" type="font/woff2" crossorigin>

  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="Alexander Ruppel | Softwareentwickler">
  <meta property="og:description"
        content="KI-Anwendungen von der Anforderung bis in den produktiven Einsatz. Vom Dachdeckermeister zum Softwareentwickler.">
  <meta property="og:url" content="https://alexander-ruppel.de/">
  <meta name="twitter:card" content="summary_large_image">
</head>

<body>
  <app-root></app-root>
</body>
</html>
